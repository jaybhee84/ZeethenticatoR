plugins { id 'com.android.application' }

android {
    namespace 'com.local.authenticator'
    compileSdk 36
    defaultConfig {
        applicationId 'com.local.authenticator'
        minSdk 26
        targetSdk 36
        // CI passes its run number so every build installs as an update over the last one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    // Same key on every build, or Android refuses to update and you must uninstall (which wipes your keys).
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../../release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'zeeth'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}

dependencies { implementation 'androidx.webkit:webkit:1.14.0' }

// The app ships the same index.html as the web version.
tasks.register('copyWebApp', Copy) { from '../../index.html'; into 'src/main/assets' }
preBuild.dependsOn copyWebApp
